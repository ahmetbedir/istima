<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İstima</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../icons/logo.svg" alt="" width="30" height="30">
    <div class="wordmark">İstima</div>
    <span class="chip" id="engine"><span class="dot"></span><span id="engine-text" data-i18n="engineOnDevice"></span></span>
  </header>

  <main>
    <!-- reading now -->
    <section id="now" class="card panel" hidden>
      <div class="kicker" id="now-kicker" data-i18n="popupNowReading"></div>
      <h1 class="title" id="now-title"></h1>
      <p class="excerpt" id="now-excerpt"></p>
      <div class="progress-row">
        <div class="progress"><div class="bar" id="now-bar"></div></div>
        <span class="count" id="now-count"></span>
      </div>
      <div class="status" id="now-status"></div>
      <div class="controls">
        <button class="ctl" id="prev" type="button" data-i18n-aria="playerPrev" data-i18n-title="playerPrev">
          <svg viewBox="0 0 24 24"><path d="M17.5 6.2v11.6a.9.9 0 0 1-1.4.75L8.4 13.2V17a1 1 0 0 1-2 0V7a1 1 0 0 1 2 0v3.8l7.7-5.35a.9.9 0 0 1 1.4.75z" fill="currentColor"/></svg>
        </button>
        <button class="main" id="toggle" type="button"></button>
        <button class="ctl" id="next" type="button" data-i18n-aria="playerNext" data-i18n-title="playerNext">
          <svg viewBox="0 0 24 24"><path d="M6.5 6.2v11.6a.9.9 0 0 0 1.4.75l7.7-5.35V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v3.8L7.9 5.45a.9.9 0 0 0-1.4.75z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="segmented" id="speeds" role="group" data-i18n-aria="playerSpeed"></div>
      <div class="row-actions">
        <button class="link-btn" id="goto" type="button" data-i18n="popupGoToTab" hidden></button>
        <button class="link-btn danger" id="stop" type="button" data-i18n="popupStop"></button>
      </div>
    </section>

    <!-- article found -->
    <section id="found" class="card panel" hidden>
      <div class="kicker" data-i18n="popupFound"></div>
      <h1 class="title" id="found-title"></h1>
      <p class="meta" id="found-meta"></p>
      <button class="btn btn-primary btn-lg btn-block" id="listen" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z" fill="currentColor"/></svg>
        <span data-i18n="popupListen"></span>
      </button>
    </section>

    <!-- nothing to read -->
    <section id="none" class="card panel empty" hidden>
      <svg class="empty-art" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="8" width="40" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M21 21h22M21 30h22M21 39h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <p class="empty-title" data-i18n="popupNoneTitle"></p>
      <p class="muted small" data-i18n="popupNoneText"></p>
      <button class="btn btn-block" id="read-anyway" type="button" data-i18n="popupReadAnyway"></button>
    </section>

    <!-- browser pages -->
    <section id="restricted" class="card panel empty" hidden>
      <p class="empty-title" data-i18n="popupRestrictedTitle"></p>
      <p class="muted small" data-i18n="popupRestrictedText"></p>
    </section>

    <p class="error" id="error" role="alert" hidden></p>

    <div class="auto-hint" id="auto-hint" hidden>
      <span data-i18n="popupAutoOff"></span>
      <button class="link-btn" id="auto-on" type="button" data-i18n="popupAutoEnable"></button>
    </div>
  </main>

  <footer class="foot">
    <span class="private">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span data-i18n="popupPrivate"></span>
    </span>
    <nav>
      <a href="#" id="open-options" data-i18n="popupSettings"></a>
      <a href="#" id="open-shortcuts" data-i18n="popupShortcuts"></a>
    </nav>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
